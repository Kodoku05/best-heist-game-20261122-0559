<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GILDED — The Star Sapphire Gala Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 8px; top: 8px; z-index: 5; display: none; white-space: pre;
    font: 13px monospace; color: #f2ead8; background: rgba(10,8,18,0.9); padding: 10px 12px; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="GILDED: a top-down heist game. Steal the Star Sapphire and escape without being seen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="selftest"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
